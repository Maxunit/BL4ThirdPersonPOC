name: Build SDKMOD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Build first: the package smoke test needs dist/BL4ThirdPersonPOC.sdkmod.
      - name: Build SDKMOD
        run: python tools/build_sdkmod.py

      - name: Run tests
        working-directory: tests
        run: python -m unittest discover -s . -p "test_*.py"

      - name: Upload SDKMOD
        uses: actions/upload-artifact@v7
        with:
          name: BL4ThirdPersonPOC
          path: dist/BL4ThirdPersonPOC.sdkmod
          archive: false
          if-no-files-found: error
          retention-days: 30
